name: Build and Deploy Web Preview

on:
  push:
    branches:
      - feature/automatic-location-prayer-times
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import third adhan from main and normalize audio
        run: |
          if [ ! -f assets/adhan/adhan-3.mp3 ]; then
            git fetch origin main
            mkdir -p assets/adhan
            git show "origin/main:assets/اذان.m4a" > /tmp/adhan-3.m4a
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            fi
            ffmpeg -y -i /tmp/adhan-3.m4a -vn -codec:a libmp3lame -b:a 160k assets/adhan/adhan-3.mp3
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/adhan/adhan-3.mp3
            git commit -m "assets: import third adhan recording from main"
            git push
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript validation
        run: pnpm check
      - name: Automated tests
        run: pnpm test
      - name: Save updated pnpm lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm lockfile for expo-audio"
            git push
          fi
      - name: Export Expo Web
        run: npx expo export --platform web --output-dir dist
      - name: Add Pages metadata
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
